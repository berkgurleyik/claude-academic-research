<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Academic Research</title>
<style>
  :root { --bg:#faf8f4; --fg:#1d1b18; --muted:#6b665e; --line:#e3ded4; --accent:#8a4b2a; --card:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161513; --fg:#ece8e1; --muted:#9a948a; --line:#2c2a26; --accent:#d99a72; --card:#1e1c1a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.55 Georgia, "Times New Roman", serif; }
  main { max-width:720px; margin:0 auto; padding:40px 16px 64px; }
  h1 { font-size:1.9rem; margin:0 0 4px; letter-spacing:-.01em; }
  .sub { color:var(--muted); margin:0 0 32px; font-family:system-ui, sans-serif; font-size:.9rem; }
  h2 { font-family:system-ui, sans-serif; font-size:.75rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:32px 0 12px; }
  ul { list-style:none; padding:0; margin:0; }
  li { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:10px; }
  li a { color:var(--accent); font-weight:bold; text-decoration:none; }
  li a:hover { text-decoration:underline; }
  li p { margin:4px 0 0; color:var(--muted); font-size:.92rem; }
  code { font-family:ui-monospace, Menlo, monospace; font-size:.82rem; word-break:break-all; background:var(--card); border:1px solid var(--line); padding:2px 6px; border-radius:4px; }
  .err { color:#b3402a; }
</style>
</head>
<body>
<main>
  <h1>Claude Academic Research</h1>
  <p class="sub" id="meta">Yükleniyor…</p>

  <h2>Veri dosyaları</h2>
  <ul id="files"></ul>

  <h2>API adresi</h2>
  <p>Tüm dosyaların listesi: <code id="api"></code></p>
</main>
<script>
  const base = location.href.replace(/[^/]*$/, "");
  document.getElementById("api").textContent = base + "data/index.json";
  fetch("data/index.json", { cache: "no-store" })
    .then(r => r.json())
    .then(idx => {
      document.getElementById("meta").textContent = "Son güncelleme: " + (idx.updated || "—") + " · " + idx.files.length + " dosya";
      const ul = document.getElementById("files");
      idx.files.forEach(f => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = f.path; a.textContent = f.title || f.path;
        const p = document.createElement("p");
        p.textContent = (f.description || "") + (f.updated ? " · " + f.updated : "");
        li.append(a, p); ul.append(li);
      });
    })
    .catch(() => {
      const m = document.getElementById("meta");
      m.textContent = "data/index.json okunamadı."; m.className = "sub err";
    });
</script>
</body>
</html>
